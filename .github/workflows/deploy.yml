name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets are set
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FN_ENV: ${{ secrets.FUNCTIONS_ENV }}
        run: |
          if [ -z "$SA" ] || [ -z "$FN_ENV" ]; then
            echo "::notice::Skipping deploy: add FIREBASE_SERVICE_ACCOUNT and FUNCTIONS_ENV repository secrets to enable it (see README)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        if: steps.check.outputs.enabled == 'true'
        run: npm ci
        working-directory: functions

      - name: Write credentials and function config
        if: steps.check.outputs.enabled == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FN_ENV: ${{ secrets.FUNCTIONS_ENV }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          printf '%s\n' "$FN_ENV" > functions/.env
          # Which service account / project the key belongs to (not secret), to help diagnose permission errors.
          echo "::notice title=Deploying as::$(jq -r '"\(.client_email) (project \(.project_id))"' "$RUNNER_TEMP/sa.json")"

      # The birthday job first went out in africa-south1, which has no Cloud Scheduler, so Firebase
      # can't delete it itself. Remove that leftover directly (no-op once it's gone).
      - name: Remove leftover africa-south1 birthday function
        if: steps.check.outputs.enabled == 'true'
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          if gcloud functions describe birthdays --region=africa-south1 --project=forries-2815d >/dev/null 2>&1; then
            gcloud functions delete birthdays --region=africa-south1 --project=forries-2815d --quiet
          fi

      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          npx --yes firebase-tools@15.34.0 deploy --project forries-2815d --non-interactive --force 2>&1 | tee deploy.log

      # Surface the reason as an annotation, so it shows on the run's summary page.
      - name: Report deploy error
        if: failure() && steps.check.outputs.enabled == 'true'
        run: |
          {
            grep -iE "error|denied|permission|failed|not enabled|has not been used" deploy.log || true
            echo '--- firebase-debug.log (tail) ---'
            tail -n 40 firebase-debug.log 2>/dev/null || true
          } | tail -n 70 > report.txt
          msg=$(sed 's/%/%25/g; s/\r//g' report.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Firebase deploy failed::$msg"
